[project]
site_name = "vizor"
site_description = "A fast detector kept honest by a slower, smarter one"
site_url = "https://y-t-g.github.io/vizor/"
site_author = "Mohammed Yasin"
copyright = "Apache-2.0"

repo_url = "https://github.com/Y-T-G/vizor"
repo_name = "Y-T-G/vizor"
edit_uri = "edit/master/docs/"

nav = [
  { "Home" = "index.md" },
  { "Install" = "install.md" },
  { "How it works" = "how-it-works.md" },
  { "Models" = "models.md" },
  { "Caveats" = "caveats.md" },
  { "Reference" = [
    { "Pipeline" = "reference/pipeline.md" },
    { "Data" = "reference/data.md" },
    { "Models" = "reference/models.md" },
    { "Utilities" = "reference/utils.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Y-T-G/vizor"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/vizor/"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.snippets = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tilde = {}

[project.plugins.search]

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "table"
show_source = true
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
heading_level = 2
members_order = "source"
separate_signature = true
signature_crossrefs = true
merge_init_into_class = true
filters = ["!^_"]
