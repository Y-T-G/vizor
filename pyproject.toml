[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vizor"
description = "A fast detector kept honest by a slower, smarter one"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Mohammed Yasin" }]
keywords = ["detection", "tracking", "vlm", "refinement", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.22",
    "opencv-python>=4.6",
]

[project.optional-dependencies]
hf = ["torch>=2.0", "transformers>=4.40", "pillow>=9.0", "einops", "timm"]
api = ["openai>=1.0"]
groq = ["groq>=0.11"]
dev = ["pytest>=7", "ruff>=0.5"]
docs = ["zensical>=0.0.60", "mkdocstrings[python]>=0.25"]

[project.urls]
Homepage = "https://github.com/Y-T-G/vizor"
Documentation = "https://y-t-g.github.io/vizor/"
Issues = "https://github.com/Y-T-G/vizor/issues"

[tool.setuptools.dynamic]
version = { attr = "vizor.__version__" }

[tool.setuptools.packages.find]
include = ["vizor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
