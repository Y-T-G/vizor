site_name: vizor
site_description: A fast detector kept honest by a slower, smarter one
site_url: https://y-t-g.github.io/vizor/
repo_url: https://github.com/Y-T-G/vizor
repo_name: Y-T-G/vizor
edit_uri: edit/master/docs/
copyright: Apache-2.0

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - Install: install.md
  - How it works: how-it-works.md
  - Models: models.md
  - Caveats: caveats.md
  - Reference:
      - Pipeline: reference/pipeline.md
      - Data: reference/data.md
      - Models: reference/models.md
      - Utilities: reference/utils.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 2
            members_order: source
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]

watch:
  - vizor
  - README.md
